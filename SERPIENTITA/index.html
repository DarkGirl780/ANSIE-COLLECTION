<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERPIENTITA CON ANSIEDAD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="lcd-frame">
      <div class="lcd-header"> Serpientita con Ansiedad </div>
      
      <!-- Botón Cerrar estilo ventana -->
      <button id="backBtn" class="close-button">✕</button>
     
      <!-- Menú Inicio -->
      <div id="startScreen" class="screen">
        <h1>SERPIENTE</h1>
        <p>ESTILO LCD RETRO</p>
        <button id="startBtn">INICIAR JUEGO</button>
        <div class="controls-info">
          WASD / Flechas = Mover<br>
          P = Pausa
        </div>
      </div>
      <!-- Game Over -->
      <div id="gameOverScreen" class="screen" style="display: none;">
        <h1>GAME OVER</h1>
        <p id="finalScore">SCORE: 00000</p>
        <button id="retryBtn">REINTENTAR</button>
      </div>
      <!-- Victoria -->
      <div id="winScreen" class="screen" style="display: none;">
        <h1 style="color:#ffff00;">¡VICTORIA!</h1>
        <p id="winScore">SCORE: 00000</p>
        <p>¡Llegaste al nivel 20!</p>
        <button id="winRestartBtn">JUGAR DE NUEVO</button>
      </div>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <!-- Controles Táctiles -->
      <div class="touch-controls">
        <div class="touch-row">
          <button class="touch-btn" id="btnUp">↑</button>
        </div>
        <div class="touch-row">
          <button class="touch-btn" id="btnLeft">←</button>
          <button class="touch-btn" id="btnDown">↓</button>
          <button class="touch-btn" id="btnRight">→</button>
        </div>
        <div class="touch-row touch-row-pause">
          <button class="touch-btn touch-btn-pause" id="btnPause">⏸</button>
        </div>
      </div>
      <div class="lcd-footer">
        <div id="score"> SCORE: 00000</div>
        <div id="level">LEVEL: 01</div>
        <div id="highscore">HI: 00000</div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
