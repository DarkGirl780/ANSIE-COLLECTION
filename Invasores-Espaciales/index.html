<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVASORES ESPACIALES</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <div class="lcd-frame">
      <div class="lcd-header">DISPARA O TE DISPARAN</div>

      <button id="backBtn" class="close-button" aria-label="Volver">✕</button>

      <div id="startScreen" class="screen">
        <h1>INVASORES</h1>
        <p>Defiende la órbita con un escuadrón de neón</p>
        <button id="startBtn">INICIAR JUEGO</button>
        <div class="controls-info">
          Flechas = Mover<br />
          Espacio = Disparar<br />
          P = Pausa
        </div>
      </div>

      <div id="pauseScreen" class="screen" style="display: none;">
        <h1>PAUSA</h1>
        <p>La batalla se detuvo</p>
        <button id="resumeBtn">CONTINUAR</button>
        <button id="restartPauseBtn" class="secondary-button">REINICIAR</button>
      </div>

      <div id="gameOverScreen" class="screen" style="display: none;">
        <h1>GAME OVER</h1>
        <p id="finalScore">SCORE: 000000</p>
        <button id="retryBtn">REINTENTAR</button>
      </div>

      <div id="victoryScreen" class="screen" style="display: none;">
        <h1>¡VICTORIA!</h1>
        <p>La galaxia fue liberada del invasor final</p>
        <p id="victoryScore">SCORE: 000000</p>
        <button id="victoryBtn">JUGAR DE NUEVO</button>
      </div>

      <canvas id="gameCanvas" width="400" height="400" aria-label="Canvas del juego Invasores Espaciales"></canvas>

      <div class="touch-controls">
        <div class="touch-row">
          <button class="touch-btn" id="btnLeft">←</button>
          <button class="touch-btn" id="btnShoot">●</button>
          <button class="touch-btn" id="btnRight">→</button>
        </div>
        <div class="touch-row">
          <button class="touch-btn" id="btnPause">⏸</button>
        </div>
      </div>

      <div class="lcd-footer">
        <div id="score">SCORE: 000000</div>
        <div id="level">LEVEL: 01</div>
        <div id="lives">LIVES: 03</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
